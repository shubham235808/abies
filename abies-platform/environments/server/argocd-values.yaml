global:
  domain: argocd.local
configs:
  params:
    server.insecure: false
server:
  service:
    type: NodePort
    nodePortHttps: 30443
    nodePortHttp: 30080
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
