apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: git
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: [git, daemon, --reuseaddr, --base-path=/git, --export-all, --listen=0.0.0.0, --port=9418, /git]
          ports: [{containerPort: 9418}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: repositories, mountPath: /git, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 9418}
          livenessProbe:
            tcpSocket: {port: 9418}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: repositories
          hostPath:
            path: {{ .Values.repositoryPath | quote }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{port: 9418, targetPort: 9418}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argocdNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports: [{protocol: TCP, port: 9418}]
