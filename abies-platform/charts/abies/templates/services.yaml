{{- range $component, $port := dict "frontend" 3000 "backend" 8000 "postgres" 5432 "redis" 6379 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "abies.fullname" $ }}-{{ $component }}
  labels:
    {{- include "abies.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ClusterIP
  selector:
    {{- include "abies.selector" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - {name: service, port: {{ $port }}, targetPort: {{ $port }}}
{{- end }}
