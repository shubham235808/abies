{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "frontend" "backend" }}
{{- if gt (int (index $.Values $component).replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "abies.fullname" $ }}-{{ $component }}
  labels:
    {{- include "abies.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "abies.selector" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
