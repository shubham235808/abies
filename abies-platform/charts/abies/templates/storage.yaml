{{- range $component := list "postgres" "redis" }}
{{- $settings := index $.Values $component }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "abies.fullname" $ }}-{{ $component }}-data
  labels:
    {{- include "abies.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $settings.storageClass | quote }}
  resources:
    requests:
      storage: {{ $settings.storage | quote }}
{{- end }}
