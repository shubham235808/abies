apiVersion: v1
kind: Pod
metadata:
  name: {{ include "abies.fullname" . }}-smoke
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: busybox:1.37
      command: [sh, -ec]
      args:
        - wget -qO- http://{{ include "abies.fullname" . }}-frontend:3000/api/health/ready
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
