apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abies
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [abies.local]
      secretName: abies-tls
  rules:
    - host: abies.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
