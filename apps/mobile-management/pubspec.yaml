name: abies_mobile_management
description: ABIES Ayurveda operations/management staff app (Android + iOS).
publish_to: "none"
version: 0.1.0+1

# Same dependency set as apps/mobile (the reference patient app) where
# applicable, at the same caret ranges — resolved versions are pinned by
# pubspec.lock after `flutter pub get`. Deliberately omitted vs apps/mobile:
# path_provider/url_launcher (no report downloads here), local_auth and
# connectivity_plus (not used by this MVP's screens yet).
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (docs/mobile/MOBILE-ARCHITECTURE.md §2).
  flutter_riverpod: ^2.5.1

  # Navigation (§4).
  go_router: ^14.2.0

  # API client: HTTP + cookie jar, since auth is the `abies_session` cookie,
  # not a bearer token (docs/mobile/API-GAP-ANALYSIS.md §2, Option A).
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Encrypted-at-rest storage for the persisted cookie jar
  # (docs/mobile/SECURITY-DESIGN.md §2). Android Keystore / iOS Keychain.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Real ABIES brand mark, copied from apps/mobile/assets/images/abies-mark.png.
  assets:
    - assets/images/abies-mark.png
