name: abies_mobile
description: ABIES Ayurveda patient app (Android + iOS).
publish_to: "none"
version: 0.1.0+1

# NOTE: not yet verified with `flutter pub get` — see README.md "Status".
# Version constraints are deliberately loose (caret ranges) rather than pinned to
# an exact resolved set, since no lockfile (pubspec.lock) exists yet; pin for real
# once `flutter pub get` has actually run.
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (docs/mobile/MOBILE-ARCHITECTURE.md §2).
  flutter_riverpod: ^2.5.1

  # Navigation + deep links (§4).
  go_router: ^14.2.0

  # API client: HTTP + cookie jar, since auth is a session cookie, not a bearer
  # token (docs/mobile/API-GAP-ANALYSIS.md §2, Option A).
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Secure, encrypted-at-rest storage for the persisted cookie jar and any other
  # credential-shaped state (docs/mobile/SECURITY-DESIGN.md §2). Backed by Android
  # Keystore / iOS Keychain, never shared_preferences.
  flutter_secure_storage: ^9.2.2

  # Network-state detection, drives offline UI (§5, §19).
  connectivity_plus: ^6.0.3

  # Optional biometric unlock gate on an already-stored session (§3). Convenience
  # only, never a replacement for backend auth.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
