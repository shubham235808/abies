name: abies_panchakarma
description: ABIES Ayurveda Panchakarma Partner app (Android + iOS) — for PANCHAKARMA_CENTRE accounts.
publish_to: "none"
version: 0.1.0+1

# Same dependency set and version constraints as apps/mobile (the patient
# app this one is structured after), minus the patient-only plugins this MVP
# doesn't need yet (connectivity_plus, local_auth, path_provider).
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (docs/mobile/MOBILE-ARCHITECTURE.md §2).
  flutter_riverpod: ^2.5.1

  # Navigation (§4).
  go_router: ^14.2.0

  # API client: HTTP + cookie jar, since auth is the `abies_session` cookie,
  # not a bearer token (docs/mobile/API-GAP-ANALYSIS.md §2, Option A).
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Encrypted-at-rest storage for the persisted cookie jar
  # (docs/mobile/SECURITY-DESIGN.md §2) — Android Keystore / iOS Keychain.
  flutter_secure_storage: ^9.2.2

  # Therapist documents: picks the PDF/JPG/PNG sent as the multipart `file`
  # field of POST /api/v1/panchakarma-centres/me/therapists/[id]/documents.
  # Same package + constraint as apps/mobile-diagnostics.
  file_picker: ^8.1.2

  # Opens a document's short-lived signed URL (GET .../documents/[documentId]/
  # download) in the system browser/viewer — same package, constraint and
  # LaunchMode.externalApplication pattern as apps/mobile.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Real ABIES brand mark, copied from apps/mobile/assets/images.
  assets:
    - assets/images/abies-mark.png
