name: abies_doctor
description: ABIES Ayurveda doctor app (Android + iOS) — for DOCTOR-role partners.
publish_to: "none"
version: 0.1.0+1

# Same architecture and dependency set as apps/mobile (the patient app) —
# see README.md. Only what this app actually uses is listed; the patient
# app's connectivity/local_auth/path_provider deps have no caller here yet.
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (docs/mobile/MOBILE-ARCHITECTURE.md §2).
  flutter_riverpod: ^2.5.1

  # Navigation (§4).
  go_router: ^14.2.0

  # API client: HTTP + cookie jar, since auth is the `abies_session` cookie,
  # not a bearer token (docs/mobile/API-GAP-ANALYSIS.md §2, Option A).
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Encrypted-at-rest storage for the persisted cookie jar
  # (docs/mobile/SECURITY-DESIGN.md §2) — never shared_preferences.
  flutter_secure_storage: ^9.2.2

  # Credential-document upload (POST /api/v1/doctors/me/documents) — same
  # package and constraint as apps/mobile-diagnostics' report upload.
  file_picker: ^8.1.2

  # Opens a document's short-lived signed download URL in the system
  # viewer — same constraint as apps/mobile.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Real ABIES brand mark, copied from apps/mobile/assets/images/.
  assets:
    - assets/images/abies-mark.png
