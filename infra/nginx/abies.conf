# Production reverse proxy for the ABIES modular monolith.
# Only this host's :80 (and, once a real domain + certificate exist, :443)
# is exposed publicly; postgres/redis/minio never publish a host port in
# docker-compose.prod.yml, and app publishes only to 127.0.0.1 — this Nginx
# process is the one thing standing between the public internet and the
# Docker network (docs/TARGET-ARCHITECTURE.md's deployment topology).
#
# TLS: this session has no real domain name or certificate to terminate
# HTTPS with, so this file serves plain :80 for now rather than pretending
# to have TLS configured. Once a domain points at this host, run:
#   sudo certbot --nginx -d your-domain.example
# certbot rewrites this file in place to add the :443 server block, the
# certificate paths, and an HTTP->HTTPS redirect — there's nothing to
# hand-author here beyond having the HTTP server block already correct,
# which is what's below.

# Coarse edge-level rate limiting, ahead of the app's own Redis-backed
# checks (src/proxy.ts) — this blocks abusive traffic before it even reaches
# the Node process, at the cost of being IP-only (no per-mobile/per-ticket
# awareness, which is what the app-level check adds on top).
limit_req_zone $binary_remote_addr zone=abies_general:10m rate=20r/s;

# gzip: not set here — Ubuntu's stock /etc/nginx/nginx.conf already has
# `gzip on;` in the http block this file is included into, and nginx
# rejects a duplicate directive at the same context level. If deploying
# somewhere without that default, add `gzip on; gzip_vary on; gzip_types
# text/plain text/css application/json application/javascript
# text/javascript;` to that global http block instead of here.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 12m;
    client_body_timeout 15s;

    access_log /var/log/nginx/abies-access.log;
    error_log /var/log/nginx/abies-error.log;

    limit_req zone=abies_general burst=40 nodelay;

    # X-Content-Type-Options/X-Frame-Options/Referrer-Policy/CSP/HSTS are
    # already set by the app itself (next.config.mjs) and pass through
    # unchanged — not duplicated here to avoid two sources of truth for the
    # same header drifting apart.

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
