# Production reverse proxy for the ABIES modular monolith.
# Only this host's :80 and :443 are exposed publicly; postgres/redis/minio
# never publish a host port in docker-compose.prod.yml, and app publishes
# only to 127.0.0.1 — this Nginx process is the one thing standing between
# the public internet and the Docker network
# (docs/TARGET-ARCHITECTURE.md's deployment topology).
#
# TLS: real, publicly-trusted Let's Encrypt certificate for abies.in and
# www.abies.in (issued 2026-10-01, /etc/letsencrypt/live/abies.in/).
# Issued via DNS-01 (certbot certonly --manual --preferred-challenges
# dns), not the --nginx plugin's usual HTTP-01, because this host's
# inbound port 80 wasn't reachable from the internet at issuance time
# (port 443 was; port 80 is either not forwarded on the router or
# filtered by the ISP — HTTP-01 needs 80 specifically, DNS-01 needs
# neither port, only DNS control, which is why it was used instead).
#
# Consequence: certbot's renewal config (/etc/letsencrypt/renewal/abies.in.conf)
# still points at the manual DNS auth hook, which blocks waiting for a
# human to add a TXT record — the auto-renewal systemd timer CANNOT
# complete this certificate's renewal unattended. Before 2026-12-30
# (90-day expiry), either fix port 80 reachability and re-issue with
# `sudo certbot --nginx -d abies.in -d www.abies.in` (switches to HTTP-01,
# fully automatic from then on), or repeat the manual DNS-01 flow.
limit_req_zone $binary_remote_addr zone=abies_general:10m rate=20r/s;

# gzip: not set here — Ubuntu's stock /etc/nginx/nginx.conf already has
# `gzip on;` in the http block this file is included into, and nginx
# rejects a duplicate directive at the same context level. If deploying
# somewhere without that default, add `gzip on; gzip_vary on; gzip_types
# text/plain text/css application/json application/javascript
# text/javascript;` to that global http block instead of here.

# Plain :80 redirects to :443, except for the ACME HTTP-01 challenge path
# certbot needs once abies.in's DNS is actually fixed — keeping that path
# open now means certbot can run later without this file needing an edit
# first.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name abies.in www.abies.in;

    ssl_certificate /etc/letsencrypt/live/abies.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abies.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;
    client_body_timeout 15s;

    access_log /var/log/nginx/abies-access.log;
    error_log /var/log/nginx/abies-error.log;

    limit_req zone=abies_general burst=40 nodelay;

    # X-Content-Type-Options/X-Frame-Options/Referrer-Policy/CSP are
    # already set by the app itself (next.config.mjs) and pass through
    # unchanged — not duplicated here to avoid two sources of truth for the
    # same header drifting apart. HSTS now that the certificate is real —
    # deliberately held off while self-signed (see git history), since it
    # would have forced HTTPS-only in the browser for this host even
    # through an accidental plain-HTTP fallback during that period.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
