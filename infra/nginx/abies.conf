# Production reverse proxy for the ABIES modular monolith.
# Only this host's :80 and :443 are exposed publicly; postgres/redis/minio
# never publish a host port in docker-compose.prod.yml, and app publishes
# only to 127.0.0.1 — this Nginx process is the one thing standing between
# the public internet and the Docker network
# (docs/TARGET-ARCHITECTURE.md's deployment topology).
#
# TLS: abies.in's DNS does not point at this host yet (it currently
# resolves to a registrar parking page, confirmed live — not this VM's
# public IP), so certbot's HTTP-01 domain-ownership challenge can't
# succeed here. Rather than leave the site on plain HTTP while that's
# sorted out, this serves HTTPS now with a locally-generated self-signed
# certificate (/etc/nginx/ssl/abies-selfsigned.{crt,key}, SANs: abies.in,
# www.abies.in, localhost, this VM's LAN + public IPs) — real encryption,
# but browsers will show a one-time untrusted-certificate warning since no
# public CA vouches for it. Once abies.in's A record is fixed, replace
# this with a real certificate:
#   sudo certbot --nginx -d abies.in -d www.abies.in
# certbot rewrites the ssl_certificate/ssl_certificate_key lines below
# in place — nothing else here needs to change.
limit_req_zone $binary_remote_addr zone=abies_general:10m rate=20r/s;

# gzip: not set here — Ubuntu's stock /etc/nginx/nginx.conf already has
# `gzip on;` in the http block this file is included into, and nginx
# rejects a duplicate directive at the same context level. If deploying
# somewhere without that default, add `gzip on; gzip_vary on; gzip_types
# text/plain text/css application/json application/javascript
# text/javascript;` to that global http block instead of here.

# Plain :80 redirects to :443, except for the ACME HTTP-01 challenge path
# certbot needs once abies.in's DNS is actually fixed — keeping that path
# open now means certbot can run later without this file needing an edit
# first.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/abies-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/abies-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 12m;
    client_body_timeout 15s;

    access_log /var/log/nginx/abies-access.log;
    error_log /var/log/nginx/abies-error.log;

    limit_req zone=abies_general burst=40 nodelay;

    # X-Content-Type-Options/X-Frame-Options/Referrer-Policy/CSP are
    # already set by the app itself (next.config.mjs) and pass through
    # unchanged — not duplicated here to avoid two sources of truth for the
    # same header drifting apart. HSTS is deliberately NOT added while the
    # certificate is self-signed — it would force HTTPS-only in the
    # browser for this host even after a real certificate is installed,
    # which is fine, but also for any accidental future plain-HTTP
    # request during that self-signed period, which could otherwise be
    # confusing to debug. Add it once the real certificate is live.

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
