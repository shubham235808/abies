# Manual trigger: `kubectl create -f tekton/pipelineruns/migrator.yaml`.
# Same ServiceAccount/credentials requirement as the four app PipelineRuns
# — see client-web.yaml's header comment.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-migrator-
spec:
  serviceAccountName: abies-ci-sa
  pipelineRef: {name: build-migrator}
  params:
    - {name: app-repo-url, value: "https://git.abies.in/abies/abies-application.git"}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
    - name: gitops
      volumeClaimTemplate:
        spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 256Mi}}}
