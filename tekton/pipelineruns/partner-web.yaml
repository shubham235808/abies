# Manual trigger: `kubectl create -f tekton/pipelineruns/partner-web.yaml`
# (generateName avoids collisions on repeat runs). image-repo/gitops-repo-url/
# overlay-path all come from build-and-deploy.yaml's own defaults (real
# values straight from docs/platform/CONTRACT.md) — only app-name/
# app-repo-url need setting per app; the other three apps' PipelineRuns
# are identical but for app-name.
#
# Requires the gitea-credentials Secret attached to the abies-ci-sa
# ServiceAccount — see this repo's README.md's "Gitea credentials" setup
# step. Not a workspace binding here; Tekton's credential-initializer
# picks it up from the ServiceAccount automatically.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-deploy-partner-web-
spec:
  taskRunTemplate:
    serviceAccountName: abies-ci-sa
  pipelineRef: {name: build-and-deploy}
  params:
    - {name: app-name, value: partner-web}
    - {name: app-repo-url, value: "https://git.abies.in/abies/abies-application.git"}
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: {requests: {storage: 1Gi}}
    - name: ssl-ca
      configMap: {name: abies-internal-ca}
    - name: gitops
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources: {requests: {storage: 256Mi}}
