# CI pipeline for one app: clone this repo at a revision, build+push its
# image to Harbor, then write its digest into the GitOps repo's abies-dev
# overlay. Run once per app (see ../pipelineruns/*.yaml) — a single app's
# commit shouldn't force a rebuild/redeploy of the other three.
#
# Depends on the `git-clone` Task from the Tekton catalog (confirmed live
# against this cluster: ClusterTask isn't even a registered kind on this
# Tekton Pipelines version — the catalog's own v0.9 manifest already
# ships as `kind: Task`, so this needs installing per-namespace, in
# abies-ci specifically). If it's not already installed:
#   kubectl apply -n abies-ci -f https://raw.githubusercontent.com/tektoncd/catalog/main/task/git-clone/0.9/git-clone.yaml
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-deploy
spec:
  description: >-
    Builds one ABIES app from source, pushes it to Harbor, and writes its
    digest into abies-gitops for ArgoCD to pick up.
  params:
    - name: app-name
      description: One of client-web, partner-web, management-web, platform-api.
    - name: app-repo-url
      description: abies-application's clone URL, e.g. https://git.abies.in/abies/abies-application.git.
    - name: app-revision
      description: Git ref in the app repo to build.
      default: main
    - name: image-repo
      description: Registry + project path to push to — harbor.abies.in/abies per docs/platform/CONTRACT.md §6.
      default: harbor.abies.in/abies
    - name: gitops-repo-url
      description: abies-gitops's clone URL, e.g. https://git.abies.in/abies/abies-gitops.git.
      default: https://git.abies.in/abies/abies-gitops.git
    - name: gitops-revision
      default: main
    - name: overlay-path
      description: >-
        Path within the GitOps repo whose kustomization.yaml images:
        block gets updated — environments/dev for abies-dev (all four
        components' image references live in this one file now, not a
        separate overlay per app — docs/platform/CONTRACT.md §20's
        applications/base + environments/<env> layout).
      default: environments/dev
  workspaces:
    - name: source
      description: Holds the checked-out app repo.
    - name: gitops
      description: Holds the checked-out GitOps repo.
    # CA bundle for git-clone over HTTPS to git.abies.in (internal Root CA).
    - name: ssl-ca
  tasks:
    - name: fetch-source
      taskRef: {name: git-clone, kind: Task}
      workspaces:
        - {name: output, workspace: source}
      params:
        - {name: url, value: $(params.app-repo-url)}
        - {name: revision, value: $(params.app-revision)}
        - {name: crtFileName, value: abies-internal-root-ca.crt}

    # No explicit auth workspace — Tekton's credential-initializer
    # auto-configures git credentials from the Gitea Secret attached to
    # this PipelineRun's ServiceAccount, for every step of every Task in
    # this Pipeline (see tekton/README.md's "Gitea credentials" setup
    # step), including update-gitops-image's push later.
    - name: fetch-gitops
      taskRef: {name: git-clone, kind: Task}
      workspaces:
        - {name: output, workspace: gitops}
        - {name: ssl-ca-directory, workspace: ssl-ca}
      params:
        - {name: url, value: $(params.gitops-repo-url)}
        - {name: revision, value: $(params.gitops-revision)}
        - {name: crtFileName, value: abies-internal-root-ca.crt}

    - name: build-push
      runAfter: [fetch-source]
      taskRef: {name: build-push-image}
      workspaces:
        - {name: source, workspace: source}
      params:
        - {name: app-name, value: $(params.app-name)}
        - name: image
          value: "$(params.image-repo)/$(params.app-name):$(tasks.fetch-source.results.commit)"

    - name: update-gitops
      runAfter: [build-push, fetch-gitops]
      taskRef: {name: update-gitops-image}
      workspaces:
        - {name: gitops, workspace: gitops}
      params:
        # Full image name (registry + path, no tag/digest) — must match
        # the `images[].name` Kustomize is matching against in
        # environments/dev/kustomization.yaml exactly.
        - {name: app-name, value: "$(params.image-repo)/$(params.app-name)"}
        - name: image
          value: "$(params.image-repo)/$(params.app-name)@$(tasks.build-push.results.digest)"
        - {name: overlay-path, value: $(params.overlay-path)}
        - {name: git-revision, value: $(params.gitops-revision)}
