# Builds one of the four apps (client-web/partner-web/management-web/
# platform-api) or the shared migrator image from this repo's single
# parameterized Dockerfile, and pushes it to the configured registry.
# Uses kaniko (not a Docker-in-Docker build) since Tekton build Pods
# shouldn't need a privileged container or access to a host Docker socket.
#
# Image, CA-mount, and registry-auth-mount shape all copied directly from
# the platform team's own validated reference Task in abies-ci
# (`kubectl get task kaniko-harbor-build -n abies-ci -o yaml`), not
# guessed — confirms docs/platform/CONTRACT.md §7's
# ghcr.io/osscontainertools/kaniko image, and that Harbor's cert is a
# real internal CA to trust (abies-internal-ca ConfigMap), not something
# to bypass with --insecure/--skip-tls-verify.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-push-image
spec:
  description: >-
    Builds apps/<app-name> (or the `migrator` target) via the repo's root
    Dockerfile and pushes the resulting image to IMAGE.
  params:
    - name: app-name
      description: One of client-web, partner-web, management-web, platform-api — passed as the Dockerfile's APP_NAME build-arg.
      type: string
    - name: image
      description: >-
        Full destination image reference, including a tag (the calling
        Pipeline uses the source commit SHA — see build-and-deploy.yaml).
        This Task also emits the pushed image's digest as a result; the
        GitOps repo is updated with that digest, not this tag
        (docs/platform/CONTRACT.md §6: digest-pinned, not `:latest` or any
        other mutable tag — the tag here exists for human traceability in
        Harbor's UI, not as the actual deploy reference).
      type: string
    - name: dockerfile-target
      description: Dockerfile build target to stop at (runner for an app image, migrator for the migration image).
      type: string
      default: runner
    - name: dockerfile
      type: string
      default: ./Dockerfile
    - name: context
      type: string
      default: .
    - name: registry-auth-secret
      description: kubernetes.io/dockerconfigjson Secret with Harbor push credentials.
      type: string
      default: harbor-push
    - name: harbor-ca-configmap
      description: ConfigMap holding Harbor's internal root CA, keyed abies-internal-root-ca.crt.
      type: string
      default: abies-internal-ca
  results:
    - name: digest
      description: The pushed image's sha256 digest (e.g. sha256:abc123...), read by update-gitops-image.yaml.
  workspaces:
    - name: source
      description: Checked-out app repo (see pipelines/build-and-deploy.yaml's fetch-source task).
  steps:
    - name: build-and-push
      image: harbor.abies.in/ghcr/osscontainertools/kaniko:latest
      command: ["/kaniko/executor"]
      workingDir: $(workspaces.source.path)
      args:
        - --dockerfile=$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --target=$(params.dockerfile-target)
        - --build-arg=APP_NAME=$(params.app-name)
        - --digest-file=$(results.digest.path)
        - --cache=true
      volumeMounts:
        - {name: registry-auth, mountPath: /kaniko/.docker, readOnly: true}
        - {name: harbor-ca, mountPath: /kaniko/ssl/certs/abies-internal-root-ca.crt, subPath: abies-internal-root-ca.crt, readOnly: true}
  volumes:
    - name: registry-auth
      secret:
        secretName: $(params.registry-auth-secret)
        items: [{key: .dockerconfigjson, path: config.json}]
    - name: harbor-ca
      configMap:
        name: $(params.harbor-ca-configmap)
