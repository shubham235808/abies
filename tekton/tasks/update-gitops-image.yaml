# The CI -> CD handoff: after build-push-image publishes a new image,
# this bumps that app's image reference in the GitOps repo's Kustomize
# overlay and pushes the commit. ArgoCD (watching the GitOps repo, not
# this one) picks up that commit and syncs the new image to the cluster —
# Tekton never talks to the cluster directly.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: update-gitops-image
spec:
  description: >-
    Runs `kustomize edit set image` in the given overlay directory of an
    already-checked-out GitOps repo workspace, then commits and pushes.
  params:
    - name: app-name
    - name: image
      description: Full image reference including tag, matching what build-push-image just pushed.
    - name: overlay-path
      description: Path within the gitops workspace to the kustomization.yaml to edit, e.g. environments/dev.
    - name: git-revision
      description: Branch in the GitOps repo to commit and push to.
      default: main
  workspaces:
    - name: gitops
      description: Checked-out GitOps repo, writable.
    - name: ssl-ca-directory
      optional: true
      description: CA bundle so git push verifies git.abies.in (internal Root CA).
  steps:
    - name: set-image
      image: harbor.abies.in/k8s/kustomize/kustomize:v5.4.3
      # Run as the same UID git-clone uses (65532). The workspace is NFS with
      # root_squash, so a root step can't write files that the clone created.
      securityContext: {runAsUser: 65532, runAsGroup: 65532}
      env:
        - {name: HOME, value: /tekton/home}
      workingDir: $(workspaces.gitops.path)/$(params.overlay-path)
      command: ["kustomize"]
      args: ["edit", "set", "image", "$(params.app-name)=$(params.image)"]
    - name: commit-and-push
      image: harbor.abies.in/dockerhub/alpine/git:2.45.2
      # Run as the same UID git-clone uses (65532). The workspace is NFS with
      # root_squash, so a root step can't write files that the clone created.
      securityContext: {runAsUser: 65532, runAsGroup: 65532}
      env:
        - {name: HOME, value: /tekton/home}
      workingDir: $(workspaces.gitops.path)
      # No explicit credential wiring here — Tekton's credential-initializer
      # auto-populates ~/.git-credentials from the Gitea Secret attached to
      # the PipelineRun's ServiceAccount (see tekton/README.md's "Gitea
      # credentials" setup step) before ANY step in ANY Task of this
      # PipelineRun runs, including this one — same mechanism git-clone's
      # own steps rely on, just not scoped to that one Task.
      script: |
        #!/bin/sh
        set -eu
        # The workspace root is owned by nobody (NFS root_squash), so git needs
        # an explicit safe.directory entry before it will touch the repo.
        git config --global --add safe.directory "$(pwd)"
        export GIT_SSL_CAINFO="$(workspaces.ssl-ca-directory.path)/abies-internal-root-ca.crt"
        git config user.email "tekton-ci@abies.in"
        git config user.name "Tekton CI"
        git add "$(params.overlay-path)"
        if git diff --cached --quiet; then
          echo "No image change for $(params.app-name) — nothing to commit."
          exit 0
        fi
        app="$(params.app-name)"
        image="$(params.image)"
        case "$image" in
          *@sha256:*) digest="${image#*@}" ;;
          *) echo "expected a digest-pinned image, got $image"; exit 1 ;;
        esac
        overlay="$(params.overlay-path)/kustomization.yaml"
        # Rewrites only this app's digest entry in the overlay. The other
        # apps' pins are left as they are on the branch.
        pin_digest() {
          awk -v n="$app" -v d="$digest" '
            /^- digest: / { pending = $0; hold = 1; next }
            hold == 1 {
              if ($0 ~ /^  name: /) {
                split($0, a, " ")
                if (a[2] == n) { print "- digest: " d; found = 1 } else { print pending }
                print; hold = 0; next
              }
              print pending; hold = 0
            }
            { print }
            END { if (!found) exit 3 }
          ' "$overlay" > "$overlay.tmp" && mv "$overlay.tmp" "$overlay"
        }
        git commit -m "deploy($app): $image"
        # Other pipelines push to the same branch while this one runs, and
        # they pin other apps' digests on the same overlay file. Rebasing this
        # commit onto them conflicts on that file, so on a rejected push we
        # reset to the fresh branch, pin this app's digest again, and retry.
        pushed=0
        for attempt in 1 2 3 4; do
          if git push origin HEAD:"$(params.git-revision)"; then pushed=1; break; fi
          echo "Push rejected (attempt $attempt); re-applying $app on fresh $(params.git-revision)"
          git fetch -q origin "$(params.git-revision)"
          git reset -q --hard FETCH_HEAD
          pin_digest || { echo "$app not found in $overlay"; exit 1; }
          git add "$(params.overlay-path)"
          if git diff --cached --quiet; then
            echo "$app is already pinned to $digest on $(params.git-revision)."
            pushed=1; break
          fi
          git commit -q -m "deploy($app): $image"
        done
        test "$pushed" = 1
