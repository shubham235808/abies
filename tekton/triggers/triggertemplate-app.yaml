# Shared by all four per-app Triggers — instantiates the same
# build-and-deploy Pipeline the manual pipelineruns/*.yaml examples do,
# just with `revision`/`app-name` filled from the two merged
# TriggerBindings (github-push-revision + app-<app>) instead of typed in
# by hand. app-repo-url/image-repo/gitops-repo-url/overlay-path all come
# from the Pipeline's own defaults (real values from docs/platform/
# CONTRACT.md) — nothing left to fill in here.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-and-deploy
spec:
  params:
    - name: revision
    - name: app-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: "build-deploy-$(tt.params.app-name)-"
      spec:
        serviceAccountName: abies-ci-sa
        pipelineRef: {name: build-and-deploy}
        params:
          - {name: app-name, value: $(tt.params.app-name)}
          - {name: app-repo-url, value: "https://git.abies.in/abies/abies-application.git"}
          - {name: app-revision, value: $(tt.params.revision)}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
          - name: gitops
            volumeClaimTemplate:
              spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 256Mi}}}
