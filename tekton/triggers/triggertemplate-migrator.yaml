# Instantiates build-migrator.yaml — separate from triggertemplate-app.yaml
# since it targets a different Pipeline with a different param shape (no
# app-name). app-repo-url/image-repo/gitops-repo-url/overlay-path all come
# from the Pipeline's own defaults, same reasoning as triggertemplate-app.yaml.
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-migrator
spec:
  params:
    - name: revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: build-migrator-
      spec:
        serviceAccountName: abies-ci-sa
        pipelineRef: {name: build-migrator}
        params:
          - {name: app-repo-url, value: "https://git.abies.in/abies/abies-application.git"}
          - {name: app-revision, value: $(tt.params.revision)}
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 1Gi}}}
          - name: gitops
            volumeClaimTemplate:
              spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 256Mi}}}
