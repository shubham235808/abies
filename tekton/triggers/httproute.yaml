# Exposes the EventListener's auto-created Service (el-abies, port 8080),
# in whichever namespace it's applied to (abies-ci, same as everything
# else under tekton/triggers/), so the git host's webhook can reach it.
# TODO: real hostname for webhooks — a dedicated one rather than reusing
# dev.abies.in (keeps this off the hostname real users hit, and makes it
# trivial to lock down separately later, e.g. an IP allow-list for Gitea's
# known address — without touching the app routes at all).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: abies-webhooks
spec:
  parentRefs:
    - name: abies-internal-gateway
      namespace: abies-gateway
  hostnames:
    - ci-hooks.abies.in
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: el-abies
          port: 8080
