# Exposes the EventListener's auto-created Service (el-abies, port 8080)
# so the git host's webhook can reach it. TODO: same placeholders as
# abies-gitops's per-app HTTPRoutes — the existing Gateway's name/
# namespace and a real hostname, here a dedicated one for webhooks rather
# than reusing the public app domain (keeps this off the same hostname
# real users hit, and makes it trivial to lock down separately — e.g. an
# allow-list for the git host's known webhook IP ranges — without
# touching the app routes at all).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: abies-webhooks
spec:
  parentRefs:
    - name: TODO-gateway-name
      # namespace: TODO-gateway-namespace
  hostnames:
    - TODO-webhooks-domain
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: el-abies
          port: 8080
