# TEMPLATE ONLY, same rule as abies-gitops/common/secret.yaml: do not
# commit a real value here. This HMAC secret is shared with the git host's
# webhook config (GitHub: repo Settings -> Webhooks -> Secret) and
# validates incoming payloads actually came from it — the `github`
# interceptor on each Trigger checks the `X-Hub-Signature-256` header
# against it. Apply the real value out-of-band, same as abies-secrets:
#   kubectl create secret generic abies-webhook-secret \
#     --from-literal=secretToken=$(openssl rand -hex 20)
apiVersion: v1
kind: Secret
metadata:
  name: abies-webhook-secret
type: Opaque
stringData:
  secretToken: "CHANGE_ME"
