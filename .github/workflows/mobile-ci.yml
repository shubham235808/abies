  #   needs: analyze-and-test
  #   runs-on: macos-latest
  #   # Needs a GitHub-hosted macOS runner (confirmed available, cost/minutes
  #   # trade-off to revisit at Phase 11) and an Apple Developer Program
  #   # certificate/provisioning profile supplied via repo secrets. Not
  #   # configured yet — no Apple Developer account exists for ABIES as of
  #   # this writing.
