# Production overlay for the Ubuntu ESXi VM target (docs/TARGET-ARCHITECTURE.md).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# EXPANSION-5 — now four app services instead of one (docs/
# EXPANSION-TARGET-ARCHITECTURE.md). Differences from docker-compose.yml:
#   - postgres/redis/minio publish no host ports at all — only the four
#     app containers reach them, over the internal Docker network.
#   - each app keeps a single 127.0.0.1-only binding on its own port
#     (not docker-compose.yml's dev-mode "published on every interface"
#     bindings) — Nginx runs on the host (infra/nginx/abies.conf) and
#     proxies to 127.0.0.1:3000-3003, so those bindings have to survive
#     the overlay; only Nginx's own :80/:443 are ever reachable from
#     outside the host.
#   - restart policy is "always" for unattended recovery after VM reboot.
#   - a one-shot `migrate` service runs `prisma migrate deploy` (Dockerfile's
#     `migrator` stage) before any app starts — migrations are shared
#     infrastructure (one Postgres, one schema) regardless of how many
#     app services depend on it, so this still runs exactly once per
#     deploy, not once per app.
#
# Compose merges `ports:` across files by concatenation, not replacement.
# `!reset` clears a key to empty (postgres/redis/minio below); to *replace*
# an app's dev binding with a different one, `!override` is the right tag.

services:
  postgres:
    restart: always
    ports: !reset []

  redis:
    restart: always
    ports: !reset []

  minio:
    restart: always
    ports: !reset []

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      # The migrator stage is FROM builder, which requires APP_NAME to run
      # `pnpm --filter ${APP_NAME} run build` — migrate's own CMD doesn't
      # use that app's build output (it only runs `prisma:deploy`), so any
      # one of the four is an arbitrary but valid pick to satisfy the stage.
      args:
        APP_NAME: platform-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-abies}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-abies_ayurveda}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [abies]
    restart: "no"

  client-web:
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: !override ["127.0.0.1:3000:3000"]

  partner-web:
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: !override ["127.0.0.1:3001:3000"]

  management-web:
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: !override ["127.0.0.1:3002:3000"]

  platform-api:
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports: !override ["127.0.0.1:3003:3000"]
